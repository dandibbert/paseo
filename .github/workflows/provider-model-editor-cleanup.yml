name: Finalize provider model editor v2

on:
  push:
    branches:
      - feat/provider-model-editor
    paths:
      - .github/workflows/provider-model-editor-cleanup.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEFTHOOK: 0
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-model-editor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Apply remaining lint-safe row cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/app/src/components/provider-diagnostic-sheet.tsx')
          text = path.read_text()
          helper_anchor = 'function DiscoveredModelRow({' 
          helper = '''function iconButtonStyle({\n  hovered,\n  pressed,\n}: PressableStateCallbackType & { hovered?: boolean }) {\n  return [\n    sheetStyles.iconButton,\n    (Boolean(hovered) || pressed) && sheetStyles.iconButtonHovered,\n  ];\n}\n\n'''
          if 'function iconButtonStyle({' not in text:
              text = text.replace(helper_anchor, helper + helper_anchor, 1)
          discovered_anchor = '''}) {\n  const { theme } = useUnistyles();\n  return (\n    <View style={sheetStyles.modelRow}>'''
          discovered_replacement = '''}) {\n  const { theme } = useUnistyles();\n  const handleEdit = useCallback(() => onEdit(model), [model, onEdit]);\n  return (\n    <View style={sheetStyles.modelRow}>'''
          if discovered_anchor in text:
              text = text.replace(discovered_anchor, discovered_replacement, 1)
          text = text.replace('        onPress={() => onEdit(model)}', '        onPress={handleEdit}', 1)
          inline_style = '''        style={({\n          hovered,\n          pressed,\n        }: PressableStateCallbackType & { hovered?: boolean }) => [\n          sheetStyles.iconButton,\n          (Boolean(hovered) || pressed) && sheetStyles.iconButtonHovered,\n        ]}'''
          text = text.replace(inline_style, '        style={iconButtonStyle}', 1)
          custom_anchor = '''  const { t } = useTranslation();\n  const { theme } = useUnistyles();\n  const handleDelete = useCallback('''
          custom_replacement = '''  const { t } = useTranslation();\n  const { theme } = useUnistyles();\n  const handleEdit = useCallback(() => onEdit(model), [model, onEdit]);\n  const handleDelete = useCallback('''
          if custom_anchor in text:
              text = text.replace(custom_anchor, custom_replacement, 1)
          text = text.replace('        onPress={() => onEdit(model)}', '        onPress={handleEdit}', 1)
          text = text.replace(inline_style, '        style={iconButtonStyle}', 1)
          path.write_text(text)
          docs = Path('docs/custom-providers.md')
          d = docs.read_text()
          old = '- `models` / `additionalModels` — model overrides or additions.'
          new = ('- `models` / `additionalModels` — model overrides or additions. Model profiles support `id`, '
                 '`label`, `description`, `aliases`, `isSelectable`, `isDefault`, `contextWindowMaxTokens`, '
                 '`thinkingOptions`, `defaultThinkingOptionId`, and arbitrary `metadata`. The Provider settings UI '
                 'can edit these model-profile fields. For Codex-derived providers, an explicit '
                 '`contextWindowMaxTokens` is forwarded to Codex as `model_context_window`.')
          if old in d:
              d = d.replace(old, new, 1)
          docs.write_text(d)
          PY
          npx prettier --write packages/app/src/components/provider-model-editor-sheet.tsx packages/app/src/components/provider-diagnostic-sheet.tsx docs/custom-providers.md
      - name: Lint touched files
        run: npx oxlint packages/app/src/components/provider-model-editor-sheet.tsx packages/app/src/components/provider-diagnostic-sheet.tsx packages/protocol/src/provider-config.ts packages/server/src/server/agent/provider-registry.ts packages/server/src/server/agent/providers/codex-app-server-agent.ts
      - name: Build server stack
        run: npm run build:server
      - name: Typecheck
        run: npm run typecheck
      - name: Focused tests
        run: |
          npx vitest run \
            packages/protocol/src/provider-config.model-profile.test.ts \
            packages/server/src/server/agent/providers/codex-configured-model.test.ts \
            packages/server/src/server/agent/provider-registry.test.ts \
            packages/server/src/server/agent/providers/codex-app-server-agent.features.test.ts
      - name: Full lint
        run: npm run lint
      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/provider-model-editor-cleanup.yml
          git add packages/app/src/components/provider-diagnostic-sheet.tsx packages/app/src/components/provider-model-editor-sheet.tsx docs/custom-providers.md
          git commit -m 'fix(providers): finalize model editor UI validation'
          git push origin HEAD:feat/provider-model-editor
