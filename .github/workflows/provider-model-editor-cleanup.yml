name: Finalize provider model editor

on:
  push:
    branches:
      - feat/provider-model-editor
    paths:
      - .github/workflows/provider-model-editor-cleanup.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEFTHOOK: 0
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-model-editor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Format check
        run: npm run format:check
      - name: Build server stack
        run: npm run build:server
      - name: Typecheck
        run: npm run typecheck
      - name: Focused tests
        run: |
          npx vitest run \
            packages/protocol/src/provider-config.model-profile.test.ts \
            packages/server/src/server/agent/providers/codex-configured-model.test.ts \
            packages/server/src/server/agent/provider-registry.test.ts \
            packages/server/src/server/agent/providers/codex-app-server-agent.features.test.ts
      - name: Lint
        run: npm run lint
      - name: Remove temporary validation workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/provider-model-editor-cleanup.yml
          git commit -m 'chore: remove provider editor validation workflow'
          git push origin HEAD:feat/provider-model-editor
