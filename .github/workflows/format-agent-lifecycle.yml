name: Format lifecycle branch

on:
  push:
    branches:
      - ops/format-agent-lifecycle

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-lifecycle-clarity
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Format changed server file
        run: npx oxfmt packages/server/src/server/agent/tools/paseo-tools.ts

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/server/src/server/agent/tools/paseo-tools.ts; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/server/src/server/agent/tools/paseo-tools.ts
          git commit --no-verify -m "style: format agent list scope changes"
          git push origin HEAD:fix/agent-lifecycle-clarity
