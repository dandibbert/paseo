name: Format Codex context regression test

on:
  push:
    branches: [combined/repair-provider-editor]

permissions:
  contents: write

concurrency:
  group: format-codex-context-test
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'dandibbert/paseo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Format focused regression test
        run: npx --yes oxfmt@0.46.0 packages/server/src/server/agent/providers/codex-configured-model.test.ts
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          target=packages/server/src/server/agent/providers/codex-configured-model.test.ts
          git diff --check
          if git diff --quiet -- "$target"; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$target"
          git commit -m "style: apply oxfmt to Codex context test"
          git push origin HEAD:combined/repair-provider-editor
