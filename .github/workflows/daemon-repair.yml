name: Daemon repair validation

on:
  push:
    branches: [fix/daemon-memory-relay-recovery]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daemon-repair-${{ github.ref }}
  cancel-in-progress: true

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  LEFTHOOK: "0"

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Build server dependencies
        run: npm run build:server-deps
      - name: Export portable Linux test dependencies
        run: |
          find node_modules packages \( -name node_modules -o -name dist \) -type d -prune -print0 | tar --exclude='*darwin*' --exclude='*win32*' --exclude='*arm64*' --exclude='*android*' --exclude='*/ios/*' --exclude='*.so*' --exclude='*.dll' --exclude='*.dylib' --exclude='*.onnx' --exclude='*.a' --exclude='*.aar' --exclude='*.jar' --exclude='*/electron/dist/*' --null -T - -czf "$RUNNER_TEMP/paseo-test-deps.tar.gz"
          split -b 400m -d --additional-suffix=.part "$RUNNER_TEMP/paseo-test-deps.tar.gz" "$RUNNER_TEMP/deps-"
          ls -lh "$RUNNER_TEMP"/deps-*.part
      - uses: actions/upload-artifact@v4
        with:
          name: paseo-repair-deps-00
          path: ${{ runner.temp }}/deps-00.part
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: paseo-repair-deps-01
          path: ${{ runner.temp }}/deps-01.part
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: paseo-repair-deps-02
          path: ${{ runner.temp }}/deps-02.part
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
