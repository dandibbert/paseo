name: Linux Headless Build and Release

on:
  push:
    branches: [main, headless-publish]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish immutable headless-<commit> Release (main or promotion branch)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: headless-linux-${{ github.event_name == 'workflow_dispatch' && 'manual' || github.ref == 'refs/heads/headless-publish' && 'publish' || 'check' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  changes:
    if: github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/headless-publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      headless: ${{ steps.filter.outputs.headless }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          base: ${{ github.event.before || github.ref }}
          filters: .github/ci-paths.yml

  build:
    name: Build and boot-test Debian 12 compatible archive
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/headless-publish' || needs.changes.outputs.headless == 'true') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Validate update and rollback helper
        run: bash scripts/test-headless-update.sh

      - name: Package source-built Daemon and CLI with Node 22
        run: bash scripts/package-headless-linux.sh "$RUNNER_TEMP/headless"

      - name: Extract archive and smoke-test live daemon
        run: bash scripts/smoke-headless-linux.sh "$RUNNER_TEMP/headless/paseo-headless-linux-amd64.tar.gz"

      - name: Upload portable Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: paseo-headless-linux-amd64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/headless/paseo-headless-linux-amd64.tar.gz
            ${{ runner.temp }}/headless/paseo-headless-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish pinned GitHub Release
    needs: build
    # `changes` is skipped for dispatch and promotion pushes. A skipped ancestor skips this job
    # unless the condition starts with a status function.
    if: ${{ !cancelled() && needs.build.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.publish_release == true) || (github.event_name == 'push' && github.ref == 'refs/heads/headless-publish')) }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Require main or dedicated promotion branch
        env:
          BRANCH: ${{ github.ref }}
        run: |
          if [[ "$BRANCH" != refs/heads/main && "$BRANCH" != refs/heads/headless-publish ]]; then
            echo "::error::Release publishing requires main or headless-publish."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: paseo-headless-linux-amd64-${{ github.sha }}
          path: release

      - name: Verify artifact and publish commit-pinned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c paseo-headless-linux-amd64.tar.gz.sha256
          short_sha="$(echo "$GITHUB_SHA" | cut -c1-12)"
          tag="headless-$short_sha"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists; refusing to overwrite published bits."
            exit 1
          fi
          gh release create "$tag" \
            paseo-headless-linux-amd64.tar.gz \
            paseo-headless-linux-amd64.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Paseo Headless Linux ($short_sha)" \
            --notes "Source commit: $GITHUB_SHA. Portable Linux amd64 Daemon + CLI + Node 22 runtime. Download both files, verify SHA256 and stage before manually switching the running service." \
            --prerelease
