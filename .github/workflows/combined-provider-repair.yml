name: Personal macOS Release

on:
  workflow_dispatch:
    inputs:
      verify_build_run_id:
        description: "Existing build run to verify without rebuilding installers (empty builds anew)."
        required: false
        default: ""
        type: string
      publish_release:
        description: "Publish the personal GitHub prerelease after both installation checks pass."
        required: false
        default: false
        type: boolean
      test_release:
        description: "Publish as a test build for the app's Beta channel only (any branch, no CI wait)."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: personal-macos-${{ github.ref }}
  cancel-in-progress: false

env:
  LEFTHOOK: "0"
  SIGNER: Paseo Personal Signing
  PERSONAL_UPDATE_FEED: https://github.com/dandibbert/paseo/releases/download/personal-updates

jobs:
  source:
    if: github.repository == 'dandibbert/paseo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
      artifact_run_id: ${{ steps.revision.outputs.artifact_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.verify_build_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$BUILD_RUN_ID" ]; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "artifact_run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
            metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")
            test "$(jq -r .path <<< "$metadata")" = .github/workflows/combined-provider-repair.yml
            jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/jobs?per_page=100")
            jq -e '.jobs | map(select(.name == "source" or .name == "validate" or (.name | startswith("macos (")))) | length == 4 and all(.[]; .conclusion == "success")' <<< "$jobs"
            revision=$(jq -r .head_sha <<< "$metadata")
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
            echo "sha=$revision" >> "$GITHUB_OUTPUT"
            echo "artifact_run_id=$BUILD_RUN_ID" >> "$GITHUB_OUTPUT"
          fi
      - name: Regression check for personal signing policy
        run: python3 packages/desktop/scripts/verify-repair-signature.py --self-test

  validate:
    needs: source
    if: inputs.verify_build_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Build server stack
        run: npm run build:server
      - name: Typecheck
        run: npm run typecheck
      - name: Provider profile schema regression tests
        run: npx vitest run packages/protocol/src/provider-config.model-profile.test.ts
      - name: Focused daemon, provider and wire regression tests
        working-directory: packages/server
        run: |
          set -o pipefail
          npx vitest run \
            src/server/relay-transport.test.ts \
            src/server/relay-runtime.test.ts \
            src/server/agent/timeline-payload-store.test.ts \
            src/server/agent/agent-timeline-store.test.ts \
            src/server/agent/timeline-projection.test.ts \
            src/server/agent/provider-subagents/store.test.ts \
            src/server/agent/providers/codex/subagent-preview.test.ts \
            src/server/agent/providers/codex-app-server-agent.test.ts \
            src/server/agent/providers/codex-configured-model.test.ts \
            src/server/agent/providers/codex-app-server-agent.features.test.ts \
            src/server/agent/provider-registry.test.ts \
            src/server/agent/agent-manager.test.ts \
            src/server/agent/agent-manager-stream-coalescing.test.ts \
            src/server/session.test.ts \
            src/server/session.workspaces.test.ts \
            src/server/wire-compat.test.ts --bail=1 2>&1 | tee "$RUNNER_TEMP/combined-provider-repair-tests.log"
      - name: Reproducible isolated retained-memory benchmark
        run: |
          node --expose-gc --import tsx scripts/benchmark-daemon-timeline-memory.mjs packages/server/src/server/agent/agent-timeline-store.ts > "$RUNNER_TEMP/timeline-memory.json"
          cat "$RUNNER_TEMP/timeline-memory.json"
          git rev-parse HEAD > "$RUNNER_TEMP/source-revision.txt"
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-provider-repair-validation
          path: |
            ${{ runner.temp }}/combined-provider-repair-tests.log
            ${{ runner.temp }}/timeline-memory.json
            ${{ runner.temp }}/source-revision.txt
          retention-days: 14

  release:
    needs: [source, installed]
    if: ${{ !cancelled() && inputs.publish_release && needs.source.result == 'success' && needs.installed.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REVISION: ${{ needs.source.outputs.revision }}
      BUILD_RUN_ID: ${{ needs.source.outputs.artifact_run_id }}
      TEST_RELEASE: ${{ inputs.test_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Test builds still pass the validate and installed jobs; only Stable waits on CI.
      - name: Require green CI for the installer source
        if: ${{ !inputs.test_release }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_REVISION&per_page=100")
            latest=$(jq -c --arg sha "$SOURCE_REVISION" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.run_number) | last' <<< "$runs")
            test "$latest" != null
            if [ "$(jq -r .status <<< "$latest")" = completed ]; then
              test "$(jq -r .conclusion <<< "$latest")" = success
              echo "Source CI passed: $(jq -r .html_url <<< "$latest")"
              exit 0
            fi
            echo "Waiting for source CI: $(jq -r .html_url <<< "$latest")"
            sleep 30
          done
          echo 'Source CI did not finish within 30 minutes.' >&2
          exit 1
      - uses: actions/download-artifact@v4
        with:
          pattern: Paseo-combined-macos-*
          path: installers
          github-token: ${{ github.token }}
          run-id: ${{ needs.source.outputs.artifact_run_id }}
      - uses: actions/download-artifact@v4
        with:
          pattern: Paseo-combined-install-verification-*
          path: verification
      - name: Publish the verified personal installers
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")
          test "$(jq -r .head_sha <<< "$metadata")" = "$SOURCE_REVISION"
          build_number=$(jq -r .run_number <<< "$metadata")
          [[ "$build_number" =~ ^[0-9]+$ ]]
          root_version=$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$SOURCE_REVISION" --jq .content | base64 --decode | jq -r .version)
          [[ "$root_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # Test and stable builds share the run number, so the newer build always has the higher version.
          version="$root_version-personal.$build_number"
          if [ "$TEST_RELEASE" = true ]; then
            tag="personal-test-v$version"
            title="Paseo $version（macOS 测试版）"
          else
            tag="personal-v$version"
            title="Paseo $version（macOS 个人版）"
          fi
          mkdir release-assets
          for arch in arm64 x64; do
            installer="installers/Paseo-combined-macos-$arch"
            evidence="verification/Paseo-combined-install-verification-$arch/install-evidence"
            cp installers/Paseo-combined-macos-zip-$arch/Paseo-*.zip "$installer/"
            test "$(cat "$installer/SOURCE_REVISION.txt")" = "$SOURCE_REVISION"
            test "$(cat "$evidence/SOURCE_REVISION.txt")" = "$SOURCE_REVISION"
            (cd "$installer" && sha256sum -c SHA256SUMS.txt)
            cp "$installer/Paseo-$version-$arch.dmg" "$installer/Paseo-$version-$arch.zip" release-assets/
            cat "$installer/SHA256SUMS.txt" >> release-assets/SHA256SUMS.txt
            cp "$installer/SIGNATURE_REPORT.json" "release-assets/SIGNATURE_REPORT-$arch.json"
            for format in zip dmg; do
              jq -e . "$evidence/$format-signatures.json" > /dev/null
              cp "$evidence/$format-signatures.json" "release-assets/INSTALL_SIGNATURES-$arch-$format.json"
            done
            cp "$evidence/system.txt" "release-assets/INSTALL_SYSTEM-$arch.txt"
          done
          (cd release-assets && sha256sum -c SHA256SUMS.txt)
          printf '%s\n' "$SOURCE_REVISION" > release-assets/SOURCE_REVISION.txt
          cp installers/Paseo-combined-macos-arm64/BUILD_NOTES.txt release-assets/
          if [ "$TEST_RELEASE" = true ]; then
            printf '测试版，只推送给 App 发布通道为 Beta 的安装。分支：`%s`。\n' "$(jq -r .head_branch <<< "$metadata")" > release-notes.md
          else
            cp "docs/releases/$root_version-personal.md" release-notes.md
          fi
          printf '\n版本：`%s`。源码：`%s`。\n\n构建：%s\n\n独立安装验证：https://github.com/%s/actions/runs/%s\n' \
            "$version" "$SOURCE_REVISION" "$(jq -r .html_url <<< "$metadata")" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          existing=$(jq -c --arg tag "$tag" '.[] | select(.tag_name == $tag)' <<< "$releases")
          if [ -n "$existing" ]; then
            test "$(jq -r .draft <<< "$existing")" = true
            test "$(jq -r .target_commitish <<< "$existing")" = "$SOURCE_REVISION"
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file release-notes.md --prerelease
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --prerelease --target "$SOURCE_REVISION" \
              --title "$title" --notes-file release-notes.md
          fi
          gh release upload "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,isDraft,assets
          # Point the in-app update feed at this release only after its assets are live.
          download="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          {
            echo "version: $version"
            echo "files:"
            for arch in arm64 x64; do
              zip="release-assets/Paseo-$version-$arch.zip"
              echo "  - url: $download/Paseo-$version-$arch.zip"
              echo "    sha512: $(openssl dgst -sha512 -binary "$zip" | base64 -w0)"
              echo "    size: $(stat -c %s "$zip")"
            done
            echo "path: $download/Paseo-$version-x64.zip"
            echo "sha512: $(openssl dgst -sha512 -binary "release-assets/Paseo-$version-x64.zip" | base64 -w0)"
            echo "releaseDate: '$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'"
          } > update-manifest.yml
          cat update-manifest.yml
          # Stable app installs read latest-mac.yml; Beta reads beta-mac.yml. A stable
          # release also reaches Beta unless Beta already has a newer test build.
          feeds=()
          if [ "$TEST_RELEASE" != true ]; then
            cp update-manifest.yml latest-mac.yml
            feeds+=(latest-mac.yml)
          fi
          beta_version=$(curl -fsSL "$PERSONAL_UPDATE_FEED/beta-mac.yml" | sed -n 's/^version: //p' || true)
          if [ -z "$beta_version" ] || [ "$(printf '%s\n%s\n' "$beta_version" "$version" | sort -V | tail -1)" = "$version" ]; then
            cp update-manifest.yml beta-mac.yml
            feeds+=(beta-mac.yml)
          else
            echo "Beta keeps the newer $beta_version"
          fi
          feed_tag="${PERSONAL_UPDATE_FEED##*/}"
          if ! gh release view "$feed_tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$feed_tag" --repo "$GITHUB_REPOSITORY" --prerelease --target "$SOURCE_REVISION" \
              --title "macOS 个人版更新源" \
              --notes "Paseo 桌面 App 从这里检查更新，不用手动下载。正式版在 personal-v* 发布里，测试版在 personal-test-v* 发布里。"
          fi
          if [ "${#feeds[@]}" -gt 0 ]; then
            gh release upload "$feed_tag" "${feeds[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          fi
          # Keep the three newest test builds; older ones only clutter Releases.
          if [ "$TEST_RELEASE" = true ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' \
              | grep '^personal-test-v' | sort -V -r | tail -n +4 \
              | while read -r old; do gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes; done
          fi

  macos:
    needs: [source, validate]
    if: inputs.verify_build_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            node_heap_mb: 4096
          - runner: macos-15-intel
            arch: x64
            node_heap_mb: 8192
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ONNXRUNTIME_NODE_INSTALL: skip
      PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/combined-smoke-diagnostics
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Give the personal combined build a distinct version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = 'packages/desktop/package.json';
          const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
          const rootPkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = `${rootPkg.version}-personal.${process.env.GITHUB_RUN_NUMBER}`;
          fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          // In-app updates read the feed that the release job keeps current.
          const configPath = 'packages/desktop/electron-builder.yml';
          const upstreamFeed = 'publish:\n  provider: github\n  owner: getpaseo\n  repo: paseo\n';
          const config = fs.readFileSync(configPath, 'utf8');
          if (!config.includes(upstreamFeed)) throw new Error('electron-builder publish block changed');
          fs.writeFileSync(configPath, config.replace(upstreamFeed,
            `publish:\n  provider: generic\n  url: ${process.env.PERSONAL_UPDATE_FEED}\n`));
          NODE
      - name: Import the personal signing certificate
        env:
          P12_BASE64: ${{ secrets.PASEO_MAC_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.PASEO_MAC_SIGNING_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ]; then
            echo "Missing PASEO_MAC_SIGNING_P12_* secrets; create them with packages/desktop/scripts/create-personal-signing-cert.sh" >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/paseo-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "$SIGNER" -p "$keychain" > "$RUNNER_TEMP/signing-cert.pem"
          # electron-builder only offers identities that this runner trusts for code signing.
          # Installed Macs never need this trust; the installed job verifies without it.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing-cert.pem"
          security find-identity -v -p codesigning | grep -F "\"$SIGNER\""
          fingerprint=$(/usr/bin/openssl x509 -in "$RUNNER_TEMP/signing-cert.pem" -noout -fingerprint -sha1 | cut -d= -f2)
          echo "CERT_SHA1=$fingerprint" >> "$GITHUB_ENV"
          echo "Signing certificate SHA-1: $fingerprint"
      - name: Build the certificate-signed macOS app without publishing
        env:
          NODE_OPTIONS: --max-old-space-size=${{ matrix.node_heap_mb }}
        run: |
          npm run build:desktop -- --publish never --mac --${{ matrix.arch }} \
            "-c.mac.identity=$SIGNER" -c.forceCodeSigning=true -c.mac.timestamp=none -c.mac.notarize=false \
            -c.mac.entitlements=build/entitlements.mac.repair.plist \
            -c.mac.entitlementsInherit=build/entitlements.mac.repair.plist
      - name: Test daemon and configured-model recovery paths on macOS
        working-directory: packages/server
        run: |
          npx vitest run \
            src/server/relay-transport.test.ts \
            src/server/agent/timeline-payload-store.test.ts \
            src/server/agent/agent-timeline-store.test.ts \
            src/server/agent/providers/codex/subagent-preview.test.ts \
            src/server/agent/providers/codex-configured-model.test.ts \
            src/server/agent/provider-registry.test.ts --bail=1
      - name: Verify signed entitlements and packaged app
        shell: bash
        run: |
          set -euo pipefail
          app=$(find packages/desktop/release -maxdepth 3 -name Paseo.app -type d | head -1)
          test -n "$app"
          python3 packages/desktop/scripts/verify-repair-signature.py --app "$app" --cert-sha1 "$CERT_SHA1" > packages/desktop/release/SIGNATURE_REPORT.json
          grep -Fx 'provider: generic' "$app/Contents/Resources/app-update.yml"
          grep -Fx "url: $PERSONAL_UPDATE_FEED" "$app/Contents/Resources/app-update.yml"
          node packages/desktop/e2e/packaged-app-smoke.js --app "$app"
      - name: Record source and installer checksums
        shell: bash
        run: |
          cd packages/desktop/release
          git rev-parse HEAD > SOURCE_REVISION.txt
          shasum -a 256 Paseo-*.dmg Paseo-*.zip > SHA256SUMS.txt
          printf '%s\n' \
            'Personal fork build; signed with the personal self-signed certificate, not Apple notarized.' \
            'Includes daemon/relay recovery fixes and the advanced Provider model editor.' \
            'Hardened Runtime retained; personal main and helper signatures include the library-validation exception.' \
            'Wait until all agent tasks finish before replacing the installed desktop app.' > BUILD_NOTES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Paseo-combined-macos-${{ matrix.arch }}
          path: |
            packages/desktop/release/Paseo-*.dmg
            packages/desktop/release/SOURCE_REVISION.txt
            packages/desktop/release/SHA256SUMS.txt
            packages/desktop/release/SIGNATURE_REPORT.json
            packages/desktop/release/BUILD_NOTES.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      # The ZIP is the auto-update payload; keeping it out of the installer artifact halves the manual download.
      - uses: actions/upload-artifact@v4
        with:
          name: Paseo-combined-macos-zip-${{ matrix.arch }}
          path: packages/desktop/release/Paseo-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Paseo-combined-macos-diagnostics-${{ matrix.arch }}
          path: |
            combined-smoke-diagnostics
            packages/desktop/release/builder-debug.yml
            packages/desktop/release/SIGNATURE_REPORT.json
          retention-days: 7

  installed:
    needs: [source, macos]
    if: ${{ always() && !cancelled() && needs.source.result == 'success' && (needs.macos.result == 'success' || needs.macos.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      ONNXRUNTIME_NODE_INSTALL: skip
      PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/install-smoke-diagnostics
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install the test harness, not a new app build
        run: node scripts/npm-retry.mjs ci
      - name: Build the SDK and built-in plugin test harness
        run: npm run build:server
      - uses: actions/download-artifact@v4
        with:
          name: Paseo-combined-macos-${{ matrix.arch }}
          path: install-artifacts
          github-token: ${{ github.token }}
          run-id: ${{ needs.source.outputs.artifact_run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: Paseo-combined-macos-zip-${{ matrix.arch }}
          path: install-artifacts
          github-token: ${{ github.token }}
          run-id: ${{ needs.source.outputs.artifact_run_id }}
      - name: Read the personal signing certificate fingerprint
        env:
          P12_BASE64: ${{ secrets.PASEO_MAC_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.PASEO_MAC_SIGNING_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          fingerprint=$(/usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -passin env:P12_PASSWORD -nokeys \
            | /usr/bin/openssl x509 -noout -fingerprint -sha1 | cut -d= -f2)
          rm -f "$RUNNER_TEMP/signing.p12"
          test -n "$fingerprint"
          echo "CERT_SHA1=$fingerprint" >> "$GITHUB_ENV"
      # This runner never trusts the certificate, like an installed Mac. The requirement
      # check below is the one Squirrel.Mac runs before an in-app update replaces the app.
      - name: Validate final ZIP and DMG on a separate macOS 15 runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat install-artifacts/SOURCE_REVISION.txt)" = "$(git rev-parse HEAD)"
          (cd install-artifacts && shasum -a 256 -c SHA256SUMS.txt)
          mkdir -p install-evidence
          sw_vers > install-evidence/system.txt
          csrutil status >> install-evidence/system.txt
          base=$(mktemp -d "$RUNNER_TEMP/paseo-distribution.XXXXXX")
          mounted=0
          cleanup() {
            if test "$mounted" = 1; then hdiutil detach "$base/mount" || true; fi
            rm -rf "$base"
          }
          trap cleanup EXIT
          zip=$(find "$PWD/install-artifacts" -maxdepth 1 -name 'Paseo-*.zip' -print -quit)
          dmg=$(find "$PWD/install-artifacts" -maxdepth 1 -name 'Paseo-*.dmg' -print -quit)
          test -n "$zip" && test -n "$dmg"
          mkdir -p "$base/zip" "$base/dmg" "$base/mount"
          ditto -x -k "$zip" "$base/zip"
          python3 packages/desktop/scripts/verify-repair-signature.py --app "$base/zip/Paseo.app" --cert-sha1 "$CERT_SHA1" > install-evidence/zip-signatures.json
          node packages/desktop/e2e/packaged-app-smoke.js --app "$base/zip/Paseo.app" 2>&1 | tee install-evidence/zip-smoke.log
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$base/mount"
          mounted=1
          ditto "$base/mount/Paseo.app" "$base/dmg/Paseo.app"
          hdiutil detach "$base/mount"
          mounted=0
          python3 packages/desktop/scripts/verify-repair-signature.py --app "$base/dmg/Paseo.app" --cert-sha1 "$CERT_SHA1" > install-evidence/dmg-signatures.json
          node packages/desktop/e2e/packaged-app-smoke.js --app "$base/dmg/Paseo.app" 2>&1 | tee install-evidence/dmg-smoke.log
          git rev-parse HEAD > install-evidence/SOURCE_REVISION.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Paseo-combined-install-verification-${{ matrix.arch }}
          path: |
            install-evidence
            install-smoke-diagnostics
          retention-days: 14
