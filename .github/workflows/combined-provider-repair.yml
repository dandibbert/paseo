name: Combined provider editor validation and macOS builds

on:
  push:
    branches: [combined/repair-provider-editor]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: combined-provider-repair-${{ github.ref }}
  cancel-in-progress: false

env:
  LEFTHOOK: "0"

jobs:
  source:
    if: github.repository == 'dandibbert/paseo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Regression check for personal signing policy
        run: python3 packages/desktop/scripts/verify-repair-signature.py --self-test

  validate:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Build server stack
        run: npm run build:server
      - name: Typecheck
        run: npm run typecheck
      - name: Provider profile schema regression tests
        run: npx vitest run packages/protocol/src/provider-config.model-profile.test.ts
      - name: Focused daemon, provider and wire regression tests
        working-directory: packages/server
        run: |
          set -o pipefail
          npx vitest run \
            src/server/relay-transport.test.ts \
            src/server/relay-runtime.test.ts \
            src/server/agent/timeline-payload-store.test.ts \
            src/server/agent/agent-timeline-store.test.ts \
            src/server/agent/timeline-projection.test.ts \
            src/server/agent/provider-subagents/store.test.ts \
            src/server/agent/providers/codex/subagent-preview.test.ts \
            src/server/agent/providers/codex-app-server-agent.test.ts \
            src/server/agent/providers/codex-configured-model.test.ts \
            src/server/agent/providers/codex-app-server-agent.features.test.ts \
            src/server/agent/provider-registry.test.ts \
            src/server/agent/agent-manager.test.ts \
            src/server/agent/agent-manager-stream-coalescing.test.ts \
            src/server/session.test.ts \
            src/server/session.workspaces.test.ts \
            src/server/wire-compat.test.ts --bail=1 2>&1 | tee "$RUNNER_TEMP/combined-provider-repair-tests.log"
      - name: Reproducible isolated retained-memory benchmark
        run: |
          node --expose-gc --import tsx scripts/benchmark-daemon-timeline-memory.mjs packages/server/src/server/agent/agent-timeline-store.ts > "$RUNNER_TEMP/timeline-memory.json"
          cat "$RUNNER_TEMP/timeline-memory.json"
          git rev-parse HEAD > "$RUNNER_TEMP/source-revision.txt"
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-provider-repair-validation
          path: |
            ${{ runner.temp }}/combined-provider-repair-tests.log
            ${{ runner.temp }}/timeline-memory.json
            ${{ runner.temp }}/source-revision.txt
          retention-days: 14

  macos:
    needs: [source, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ONNXRUNTIME_NODE_INSTALL: skip
      PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/combined-smoke-diagnostics
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Give the personal combined build a distinct version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = 'packages/desktop/package.json';
          const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
          pkg.version = `0.8.0-personal.${process.env.GITHUB_RUN_NUMBER}`;
          fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          NODE
      - name: Build ad-hoc signed macOS app without publishing
        run: |
          npm run build:desktop -- --publish never --mac --${{ matrix.arch }} \
            -c.mac.identity=- -c.mac.notarize=false \
            -c.mac.entitlements=build/entitlements.mac.repair.plist \
            -c.mac.entitlementsInherit=build/entitlements.mac.repair.plist \
            -c.publish.owner=dandibbert -c.publish.repo=paseo -c.publish.channel=repair
      - name: Test daemon and configured-model recovery paths on macOS
        working-directory: packages/server
        run: |
          npx vitest run \
            src/server/relay-transport.test.ts \
            src/server/agent/timeline-payload-store.test.ts \
            src/server/agent/agent-timeline-store.test.ts \
            src/server/agent/providers/codex/subagent-preview.test.ts \
            src/server/agent/providers/codex-configured-model.test.ts \
            src/server/agent/provider-registry.test.ts --bail=1
      - name: Verify signed entitlements and packaged app
        shell: bash
        run: |
          set -euo pipefail
          app=$(find packages/desktop/release -maxdepth 3 -name Paseo.app -type d | head -1)
          test -n "$app"
          python3 packages/desktop/scripts/verify-repair-signature.py --app "$app" > packages/desktop/release/SIGNATURE_REPORT.json
          node packages/desktop/e2e/packaged-app-smoke.js --app "$app"
      - name: Record source and installer checksums
        shell: bash
        run: |
          cd packages/desktop/release
          git rev-parse HEAD > SOURCE_REVISION.txt
          shasum -a 256 Paseo-*.dmg Paseo-*.zip > SHA256SUMS.txt
          printf '%s\n' \
            'Personal fork build; ad-hoc signed, not Apple notarized.' \
            'Includes daemon/relay recovery fixes and the advanced Provider model editor.' \
            'Hardened Runtime retained; personal main and helper signatures include the library-validation exception.' \
            'Wait until all agent tasks finish before replacing the installed desktop app.' > BUILD_NOTES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Paseo-combined-macos-${{ matrix.arch }}
          path: |
            packages/desktop/release/Paseo-*.dmg
            packages/desktop/release/Paseo-*.zip
            packages/desktop/release/SOURCE_REVISION.txt
            packages/desktop/release/SHA256SUMS.txt
            packages/desktop/release/SIGNATURE_REPORT.json
            packages/desktop/release/BUILD_NOTES.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Paseo-combined-macos-diagnostics-${{ matrix.arch }}
          path: |
            combined-smoke-diagnostics
            packages/desktop/release/builder-debug.yml
            packages/desktop/release/SIGNATURE_REPORT.json
          retention-days: 7

  installed:
    needs: [source, macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      ONNXRUNTIME_NODE_INSTALL: skip
      PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/install-smoke-diagnostics
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install the test harness, not a new app build
        run: node scripts/npm-retry.mjs ci
      - uses: actions/download-artifact@v4
        with:
          name: Paseo-combined-macos-${{ matrix.arch }}
          path: install-artifacts
      - name: Validate final ZIP and DMG on a separate macOS 15 runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat install-artifacts/SOURCE_REVISION.txt)" = "$(git rev-parse HEAD)"
          (cd install-artifacts && shasum -a 256 -c SHA256SUMS.txt)
          mkdir -p install-evidence
          sw_vers > install-evidence/system.txt
          csrutil status >> install-evidence/system.txt
          base=$(mktemp -d "$RUNNER_TEMP/paseo-distribution.XXXXXX")
          mounted=0
          cleanup() {
            if test "$mounted" = 1; then hdiutil detach "$base/mount" || true; fi
            rm -rf "$base"
          }
          trap cleanup EXIT
          zip=$(find "$PWD/install-artifacts" -maxdepth 1 -name 'Paseo-*.zip' -print -quit)
          dmg=$(find "$PWD/install-artifacts" -maxdepth 1 -name 'Paseo-*.dmg' -print -quit)
          test -n "$zip" && test -n "$dmg"
          mkdir -p "$base/zip" "$base/dmg" "$base/mount"
          ditto -x -k "$zip" "$base/zip"
          python3 packages/desktop/scripts/verify-repair-signature.py --app "$base/zip/Paseo.app" > install-evidence/zip-signatures.json
          node packages/desktop/e2e/packaged-app-smoke.js --app "$base/zip/Paseo.app" 2>&1 | tee install-evidence/zip-smoke.log
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$base/mount"
          mounted=1
          ditto "$base/mount/Paseo.app" "$base/dmg/Paseo.app"
          hdiutil detach "$base/mount"
          mounted=0
          python3 packages/desktop/scripts/verify-repair-signature.py --app "$base/dmg/Paseo.app" > install-evidence/dmg-signatures.json
          node packages/desktop/e2e/packaged-app-smoke.js --app "$base/dmg/Paseo.app" 2>&1 | tee install-evidence/dmg-smoke.log
          git rev-parse HEAD > install-evidence/SOURCE_REVISION.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Paseo-combined-install-verification-${{ matrix.arch }}
          path: |
            install-evidence
            install-smoke-diagnostics
          retention-days: 14
