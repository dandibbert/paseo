name: Provider model editor integration

on:
  push:
    branches:
      - feat/provider-model-editor
    paths:
      - .github/workflows/provider-model-editor-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEFTHOOK: 0
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-model-editor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Apply integration patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-provider-model-editor-patch.mjs')
          text = path.read_text()
          marker = '\npatch("docs/custom-providers.md"'
          if marker in text:
              text = text[:text.index(marker)] + '\n'
          generated_marker = 'patch("packages/app/src/components/provider-model-editor-sheet.tsx"'
          head, sep, tail = text.partition(generated_marker)
          if sep:
              tail = tail.replace('${', '\\${')
              text = head + sep + tail
          path.write_text(text)
          PY
          node scripts/apply-provider-model-editor-patch.mjs
          python3 - <<'PY'
          from pathlib import Path
          editor = Path('packages/app/src/components/provider-model-editor-sheet.tsx')
          text = editor.read_text()
          text = text.replace('            // @ts-expect-error - outlineStyle is web-only\n', '')
          text = text.replace('isWeb && { outlineStyle: "none" }', 'isWeb ? ({ outlineStyle: "none" } as never) : undefined')
          editor.write_text(text)

          diagnostic = Path('packages/app/src/components/provider-diagnostic-sheet.tsx')
          text = diagnostic.read_text()
          text = text.replace('        m.description ?? "",\n        ...(m.aliases ?? []),\n', '        m.description ?? "",\n')
          diagnostic.write_text(text)
          PY
      - name: Format touched sources
        run: |
          npx prettier --write \
            packages/protocol/src/provider-config.ts \
            packages/protocol/src/provider-config.model-profile.test.ts \
            packages/app/src/components/provider-diagnostic-sheet.tsx \
            packages/app/src/components/provider-model-editor-sheet.tsx \
            packages/server/src/server/agent/provider-registry.ts \
            packages/server/src/server/agent/providers/codex-app-server-agent.ts \
            packages/server/src/server/agent/providers/codex-configured-model.test.ts
      - name: Commit generated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/protocol/src/provider-config.ts \
            packages/protocol/src/provider-config.model-profile.test.ts \
            packages/app/src/components/provider-diagnostic-sheet.tsx \
            packages/app/src/components/provider-model-editor-sheet.tsx \
            packages/server/src/server/agent/provider-registry.ts \
            packages/server/src/server/agent/providers/codex-app-server-agent.ts \
            packages/server/src/server/agent/providers/codex-configured-model.test.ts
          git diff --cached --quiet && { echo 'No generated changes'; exit 1; }
          git commit -m 'feat(providers): edit full model metadata in settings'
          git push origin HEAD:feat/provider-model-editor
      - name: Build server stack
        run: npm run build:server
      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          status=$?
          echo '--- compact TypeScript diagnostics ---'
          grep -E 'error TS[0-9]+|^packages/.+\([0-9]+,[0-9]+\)' typecheck.log | tail -250 || true
          exit "$status"
      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-model-editor-typecheck
          path: typecheck.log
          if-no-files-found: warn
      - name: Focused tests
        run: |
          npx vitest run \
            packages/protocol/src/provider-config.model-profile.test.ts \
            packages/server/src/server/agent/providers/codex-configured-model.test.ts \
            packages/server/src/server/agent/provider-registry.test.ts \
            packages/server/src/server/agent/providers/codex-app-server-agent.features.test.ts
      - name: Lint
        run: npm run lint
