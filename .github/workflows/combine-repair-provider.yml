name: Combine repair and provider editor

on:
  push:
    branches:
      - combined/repair-provider-editor
    paths:
      - .github/workflows/combine-repair-provider.yml

permissions:
  contents: write

jobs:
  merge-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LEFTHOOK: 0
      ONNXRUNTIME_NODE_INSTALL: skip
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: combined/repair-provider-editor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Merge repair branch and resolve the single Codex conflict
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin fix/daemon-memory-relay-recovery
          set +e
          git merge --no-commit --no-ff origin/fix/daemon-memory-relay-recovery
          merge_status=$?
          set -e
          unresolved="$(git diff --name-only --diff-filter=U)"
          expected='packages/server/src/server/agent/providers/codex-app-server-agent.ts'
          if [ "$merge_status" -eq 0 ]; then
            echo 'Repair branch unexpectedly merged without the known Codex conflict; refusing to apply a stale manual resolution.' >&2
            exit 1
          fi
          if [ "$unresolved" != "$expected" ]; then
            echo 'Unexpected merge conflict set:' >&2
            printf '%s\n' "$unresolved" >&2
            exit 1
          fi

          # Keep current upstream/provider-editor Codex code, then transplant the
          # repair branch's bounded subagent-preview changes. The provider editor
          # additions (configuredModels + model_context_window forwarding) stay intact.
          git checkout --ours -- "$expected"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/server/src/server/agent/providers/codex-app-server-agent.ts')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'import { curateAgentActivity } from "../activity-curator.js";',
              'import { CodexSubagentPreview } from "./codex/subagent-preview.js";',
              'subagent preview import',
          )
          replace_once(
              '  childItemOrder: string[];\n  childItems: Map<string, AgentTimelineItem>;',
              '  childPreview: CodexSubagentPreview;',
              'subagent state fields',
          )
          replace_once(
              '        childItemOrder: [],\n        childItems: new Map<string, AgentTimelineItem>(),',
              '        childPreview: new CodexSubagentPreview(),',
              'subagent state initialization',
          )
          replace_once(
              '''    if (!state.childItems.has(itemId)) {\n      state.childItemOrder.push(itemId);\n    }\n    state.childItems.set(itemId, item);''',
              '''    state.childPreview.upsert(itemId, item);''',
              'subagent preview upsert',
          )
          replace_once(
              '''  private getSubAgentChildTimeline(\n    state: CodexSubAgentCallState\n  ): AgentTimelineItem[] {\n    return state.childItemOrder\n      .map((itemId) => state.childItems.get(itemId))\n      .filter((item): item is AgentTimelineItem => Boolean(item));\n  }\n\n''',
              '',
              'remove full child timeline materialization',
          )
          replace_once(
              '''    const childTimeline = this.getSubAgentChildTimeline(state);\n    const log =\n      childTimeline.length > 0\n        ? curateAgentActivity(childTimeline, { labelAssistantMessages: true })\n        : "";''',
              '''    const log = state.childPreview.render();''',
              'bounded subagent preview render',
          )

          path.write_text(text)
          PY
          git add "$expected"
          test -z "$(git diff --name-only --diff-filter=U)"
          grep -q 'resolveCodexConfiguredModelConfig' "$expected"
          grep -q 'configuredModels?: ProviderProfileModel\[\]' "$expected"
          grep -q 'model_context_window' "$expected"
          grep -q 'CodexSubagentPreview' "$expected"
          grep -q 'childPreview.render()' "$expected"
          ! grep -q 'curateAgentActivity' "$expected"
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Format integrated sources
        run: |
          npx oxfmt \
            docs/custom-providers.md \
            packages/app/src/components/provider-diagnostic-sheet.tsx \
            packages/app/src/components/provider-model-editor-sheet.tsx \
            packages/protocol/src/provider-config.model-profile.test.ts \
            packages/protocol/src/provider-config.ts \
            packages/server/src/server/agent/provider-registry.ts \
            packages/server/src/server/agent/providers/codex-app-server-agent.ts \
            packages/server/src/server/agent/providers/codex-configured-model.test.ts
          git add \
            docs/custom-providers.md \
            packages/app/src/components/provider-diagnostic-sheet.tsx \
            packages/app/src/components/provider-model-editor-sheet.tsx \
            packages/protocol/src/provider-config.model-profile.test.ts \
            packages/protocol/src/provider-config.ts \
            packages/server/src/server/agent/provider-registry.ts \
            packages/server/src/server/agent/providers/codex-app-server-agent.ts \
            packages/server/src/server/agent/providers/codex-configured-model.test.ts
      - name: Build server stack
        run: npm run build:server
      - name: Typecheck
        run: npm run typecheck
      - name: Focused repair and provider tests
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run packages/protocol/src/provider-config.model-profile.test.ts
          cd packages/server
          npx vitest run \
            src/server/relay-transport.test.ts \
            src/server/relay-runtime.test.ts \
            src/server/agent/timeline-payload-store.test.ts \
            src/server/agent/agent-timeline-store.test.ts \
            src/server/agent/timeline-projection.test.ts \
            src/server/agent/provider-subagents/store.test.ts \
            src/server/agent/providers/codex/subagent-preview.test.ts \
            src/server/agent/providers/codex-app-server-agent.test.ts \
            src/server/agent/providers/codex-configured-model.test.ts \
            src/server/agent/providers/codex-app-server-agent.features.test.ts \
            src/server/agent/provider-registry.test.ts \
            src/server/agent/agent-manager.test.ts \
            src/server/agent/agent-manager-stream-coalescing.test.ts \
            src/server/session.test.ts \
            src/server/session.workspaces.test.ts \
            src/server/wire-compat.test.ts --bail=1
      - name: Memory microbenchmark
        run: node --expose-gc --import tsx scripts/benchmark-daemon-timeline-memory.mjs packages/server/src/server/agent/agent-timeline-store.ts
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/combine-repair-provider.yml
          git add -A
          git commit -m 'merge: combine daemon repair with provider model editor'
          git push origin HEAD:combined/repair-provider-editor
